name: Sentinel-AIOps CI/CD Pipeline 🚀

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-assurance:
    name: 🧪 Quality Assurance & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/analyzer/package-lock.json
            apps/dashboard/package-lock.json

      - name: ⚙️ Install & Compile NestJS Backend
        run: |
          cd apps/analyzer
          npm ci
          npm run build

      - name: ⚙️ Install & Compile React Dashboard
        run: |
          cd apps/dashboard
          npm ci
          npm run build
